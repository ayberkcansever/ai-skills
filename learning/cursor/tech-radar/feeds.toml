# tech-radar feed registry — the single source of truth for the intake crawl.
#
# type:
#   rss        — RSS/Atom feed fetched by scripts/scan_feeds.py
#   hn         — Hacker News via Algolia API (windowed, points-floored)
#   lobsters   — Lobsters hottest.json
#   endoflife  — endoflife.date API for the products listed in [settings]
#   manual     — no machine-readable feed; the AGENT must cover it with the
#                search hint during the scan (the script lists these in its
#                summary so they cannot be silently skipped)
#
# tier:  core = every scan | extended = rotated, but still crawled (crawling is free;
#        rotation now only applies to manual sources and wildcard searches)
# class: ai | platform | language | database | runtime | framework | security |
#        web | observability | press | survey | aggregator | conference | production
#
# cap:   optional per-feed override of settings.per_feed_cap, for a publisher that
#        genuinely posts more than the default in one window
#
# Coverage contract: the non-AI must-not-miss buckets in SKILL.md (platform shifts,
# data & storage, observability, security & supply chain, techniques, languages &
# web platform) each need at least one deterministic source here. Removing the last
# feed backing a bucket turns that bucket into an agent-search-only guess.
#
# Editing: add/remove [[feeds]] blocks freely — the crawler and the skill read
# this file; nothing else needs to change. Keep ids unique.

[settings]
window_days = 90
# A feed that hits this cap is reported as TRUNCATED — the agent then owes it a
# direct search, so raising the cap costs tokens but lowering it costs coverage.
per_feed_cap = 25
# Consensus band: what the crowd already voted up.
hn_min_points = 400
hn_cap = 150
# Discovery band [discovery_min, hn_min): where a project in its first weeks
# lives. Hard-capped because this band is mostly noise by volume.
hn_discovery_min_points = 120
hn_discovery_cap = 40
noise_keywords = ["webinar", "hiring", "we're hiring", "job opening", "careers at", "sponsor", "advent of code", "this week in", "weekly roundup", "newsletter", "podcast episode", "office hours", "meetup", "livestream", "ask me anything"]
# Read by the SKILL, not the crawler: a watchlist entry expires on the calendar,
# never on the scan count, so scanning less often cannot keep it alive forever.
quiet_expiry_days = 21
eol_products = ["python", "nodejs", "postgresql", "kubernetes", "java", "go", "dotnet", "django", "rails", "react", "redis", "mongodb", "mysql", "ubuntu", "debian"]
eol_horizon_days = 180

